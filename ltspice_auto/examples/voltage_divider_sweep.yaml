# 전압 분배기 - 부하저항 스윕 (결과 txt 가 표 형태로 나옴)
name: divider_sweep
title: Voltage divider with load sweep

params:
  Rload: 10k

components:
  - {ref: V1, type: voltage, nodes: [vin, 0],   value: 12}
  - {ref: R1, type: res,     nodes: [vin, out], value: 10k}
  - {ref: R2, type: res,     nodes: [out, 0],   value: 10k}
  - {ref: RL, type: res,     nodes: [out, 0],   value: "{Rload}"}

analysis: .op

sweep:
  param: Rload
  values: [1k, 5k, 10k, 50k, 100k]

measure:
  - OP vout FIND V(out)
  - OP iload FIND I(RL)
  - OP pload PARAM vout*iload
