# 반전 증폭기 (이상적 opamp, 이득 = -R2/R1 = -10)
name: inv_amp
title: Inverting amplifier (gain -10)

components:
  - {ref: V1, type: voltage, nodes: [in, 0],       value: "SINE(0 0.1 1k)"}
  - {ref: R1, type: res,     nodes: [in, n],       value: 1k}
  - {ref: R2, type: res,     nodes: [n, out],      value: 10k}
  - {ref: U1, type: opamp,   nodes: [n, 0, out],   value: opamp}   # In-, In+, OUT

directives:
  # LTspice 기본 opamp.sub 대신 직접 정의 (LTspice/ngspice 모두 동작)
  - .subckt opamp inm inp out
  - E1 out 0 inp inm 1e6
  - .ends opamp

analysis: .tran 0 3m 0 1u

measure:
  - TRAN vout_pp PP V(out) FROM 1m TO 3m
  - TRAN vin_pp PP V(in) FROM 1m TO 3m
  - TRAN gain PARAM vout_pp/vin_pp
