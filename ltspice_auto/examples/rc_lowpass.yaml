# RC 저역통과 필터 - 과도(transient) 해석
name: rc_lowpass
title: RC Low-pass filter (R=1k, C=1u, tau=1ms)

components:
  - {ref: V1, type: voltage, nodes: [in, 0], value: "PULSE(0 5 0 1n 1n 5m 10m)"}
  - {ref: R1, type: res,     nodes: [in, out], value: 1k}
  - {ref: C1, type: cap,     nodes: [out, 0],  value: 1u}

analysis: .tran 0 10m 0 1u

measure:
  - TRAN vout_max MAX V(out) FROM 0 TO 5m
  - TRAN vout_at_1ms FIND V(out) AT 1m
  - TRAN t_rise TRIG V(out) VAL=0.5 RISE=1 TARG V(out) VAL=4.5 RISE=1
  - TRAN i_r1_avg AVG I(R1) FROM 0 TO 5m

measure_desc:
  vout_max: 0~5ms 구간 출력 최대 전압 [V]
  vout_at_1ms: t=1ms 에서 출력 전압 [V] (이론값 5*(1-e^-1)=3.16V)
  t_rise: 10%~90% 상승 시간 [s] (이론값 2.2*tau=2.2ms)
  i_r1_avg: 0~5ms 평균 저항 전류 [A]
