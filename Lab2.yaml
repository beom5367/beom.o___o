      - [[15, 5], [15, 7]]
      - [[15, 9], [15, 11], [17, 11]]
      - [[21, 9], [21, 11]]
      - [[19, 11], [21, 11], [27, 11], [27, 12]]
      - [[3, 9], [3, 11], [15, 11]]
      - [[15, 5], [13, 5], [13, 15], [27, 15]]
