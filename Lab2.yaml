project: Lab2
circuits:
  - name: Fig1_반파정류
    components:
      - {ref: V1, nodes: [Vin, 0], value: SINE(0 10 60), dir: down, at: [3, 6]}
      - {ref: D1, nodes: [Vin, Vout], value: 1N4004, dir: right, at: [6, 4]}
      - {ref: R1, nodes: [Vout, 0], value: 1k, dir: down, at: [11, 6]}
    wires:
      - [[3, 6], [3, 4], [6, 4]]
      - [[8, 4], [11, 4], [11, 6]]
      - [[3, 9], [3, 11], [11, 11], [11, 9]]
    node: {Vin: [3, 4], Vout: [10.5, 4]}
    gnd: [11, 11]
    sim_only:
      - .model 1N4004 D(Is=3.699n Rs=41.4m N=1.96 Cjo=39.8p M=.333 tt=4.32u)
    analysis: .tran 0.5
    measure:
      - TRAN vpeak MAX V(Vout) FROM 0.4 TO 0.5
      - TRAN vavg AVG V(Vout) FROM 0.4 TO 0.5
      - TRAN vrms RMS V(Vout) FROM 0.4 TO 0.5

