      - {ref: C1, nodes: [Vout, 0], value: 10u, dir: down, at: [24, 12], keep: true}
      - {ref: R1, nodes: [Vout, 0], value: "{RL}", dir: down, at: [27, 12]}
    wires:
      - [[3, 6], [3, 2], [21, 2], [21, 5]]
      - [[15, 5], [17, 5]]
      - [[19, 5], [21, 5], [21, 7]]
      - [[15, 5], [15, 7]]
      - [[15, 9], [15, 11], [17, 11]]
      - [[21, 9], [21, 11]]
      - [[19, 11], [21, 11], [24, 11], [27, 11], [27, 12]]
      - [[24, 11], [24, 12]]
