      - {ref: V1, nodes: [tr, bl], value: SINE(0 10 60), dir: down, at: [3, 6]}
      - {ref: D1, nodes: [0, tr], value: 1N4004, dir: right, at: [17, 5]}
      - {ref: D2, nodes: [tr, Vout], value: 1N4004, dir: down, at: [21, 7]}
